<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>GHØST</title>

    <!-- Configurações PWA / WebAPK -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="GHØST">
    <meta name="apple-mobile-web-app-title" content="GHØST">
    <link rel="icon" id="favicon-placeholder" type="image/svg+xml">
    <link rel="apple-touch-icon" id="apple-icon-placeholder">
    <link rel="manifest" id="manifest-placeholder">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts JetBrains Mono & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Marked para formatar textos e equações -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['JetBrains Mono', 'Inter', 'monospace'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --brand-color: #10b981;
            --brand-hover: #059669;
        }

        body {
            background-color: #050505;
            color: #e4e4e7;
            font-family: 'JetBrains Mono', monospace;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .bg-brand { background-color: var(--brand-color) !important; }
        .text-brand { color: var(--brand-color) !important; }
        .border-brand { border-color: var(--brand-color) !important; }
        .hover\:bg-brand-dark:hover { background-color: var(--brand-hover) !important; }
        .glow-brand { box-shadow: 0 0 15px -3px var(--brand-color); }

        /* Estilização da resposta gerada */
        .prose-content h1, .prose-content h2, .prose-content h3 {
            font-weight: 700;
            margin-top: 0.9rem;
            margin-bottom: 0.4rem;
            color: inherit;
        }
        .prose-content p {
            margin-bottom: 0.65rem;
            line-height: 1.6;
        }
        .prose-content ul, .prose-content ol {
            padding-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .prose-content ul { list-style-type: disc; }
        .prose-content ol { list-style-type: decimal; }
        .prose-content li { margin-bottom: 0.3rem; }
        .prose-content strong { font-weight: 700; }
        .prose-content code {
            background: rgba(16, 185, 129, 0.15);
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
        }
    </style>
</head>
<body class="bg-[#050505] text-zinc-200 min-h-screen pb-12 transition-colors duration-200 font-mono">

    <!-- Topo / Cabeçalho -->
    <header id="app-header" class="bg-black/90 backdrop-blur-md border-b border-zinc-800/90 sticky top-0 z-20 shadow-lg transition-colors">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <button onclick="toggleModal(true)" aria-label="Configurações" class="p-2.5 text-zinc-300 hover:text-brand rounded-lg bg-zinc-900 border border-zinc-800 active:scale-95 transition-all">
                <i class="fa-solid fa-gear text-base"></i>
            </button>
            <div class="flex items-center gap-2.5">
                <!-- Caveira Tática Estilo Ghost (SVG Customizado) -->
                <div class="w-9 h-9 rounded-lg bg-zinc-950 border border-brand/60 flex items-center justify-center shadow-inner glow-brand">
                    <svg class="w-6 h-6 text-white" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Capuz / Balaclava -->
                        <path d="M14 26C14 14.9543 22.0589 6 32 6C41.9411 6 50 14.9543 50 26V37C50 43.5 45.5 48.5 40 51L38 58H26L24 51C18.5 48.5 14 43.5 14 37V26Z" fill="#18181b" stroke="currentColor" stroke-width="2.5"/>
                        <!-- Máscara de Caveira Branca -->
                        <path d="M18 28C18 20.5 24 15 32 15C40 15 46 20.5 46 28C46 33.5 43 37.5 39 39.5L37.5 48H26.5L25 39.5C21 37.5 18 33.5 18 28Z" fill="#f4f4f5"/>
                        <!-- Órbita Ocular Esquerda -->
                        <path d="M21 27.5L29 29.5L27.5 34.5L21.5 33L21 27.5Z" fill="#09090b"/>
                        <!-- Órbita Ocular Direita -->
                        <path d="M43 27.5L35 29.5L36.5 34.5L42.5 33L43 27.5Z" fill="#09090b"/>
                        <!-- Cavidade Nasal -->
                        <path d="M32 34L29.5 39.5H34.5L32 34Z" fill="#09090b"/>
                        <!-- Dentes / Mandíbula -->
                        <line x1="28.5" y1="42" x2="28.5" y2="48" stroke="#09090b" stroke-width="2"/>
                        <line x1="32" y1="42" x2="32" y2="48" stroke="#09090b" stroke-width="2"/>
                        <line x1="35.5" y1="42" x2="35.5" y2="48" stroke="#09090b" stroke-width="2"/>
                        <!-- Rachadura Tática na Testa -->
                        <path d="M35 16L33 21L35.5 24" stroke="#09090b" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="font-extrabold text-lg tracking-[0.22em] uppercase text-white">GHØST</span>
            </div>
            <button id="pwa-install-header" onclick="triggerInstall()" class="hidden text-xs bg-brand text-black px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 shadow-sm active:scale-95 transition-all">
                <i class="fa-solid fa-download"></i> APP
            </button>
            <div id="header-spacer" class="w-9"></div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- Seção 1: Captura / Upload da Foto -->
        <div class="theme-card bg-zinc-950/90 border border-zinc-800 rounded-xl p-4 space-y-3 shadow-md">
            <div class="flex items-center justify-between border-b border-zinc-800/90 pb-2">
                <div class="flex items-center gap-2">

                    <h2 class="font-bold text-xs uppercase tracking-wider">Captura de Alvo</h2>
                </div>
                <button id="btn-clear-photo" onclick="clearPhoto()" class="hidden text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-700 px-2.5 py-1 rounded-lg font-medium transition-colors">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Resetar
                </button>
            </div>

            <!-- Inputs Ocultos -->
            <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event)">
            <input type="file" id="gallery-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">

            <!-- Área de Seleção (quando não há foto) -->
            <div id="upload-area" class="grid grid-cols-2 gap-3 pt-1">
                <button type="button" onclick="openCamera()" class="bg-brand hover:bg-brand-dark text-black rounded-xl p-4 flex flex-col items-center justify-center gap-2 shadow-md active:scale-95 transition-all">

                        <i class="fa-solid fa-camera text-xl"></i>
                    </div>
                    <span class="text-xs font-extrabold uppercase">Tirar Foto</span>
                    <span class="text-[10px] text-black/80 text-center font-semibold">Câmera direta</span>
                </button>

                <button type="button" onclick="document.getElementById('gallery-input').click()" class="theme-input bg-black hover:border-brand border border-zinc-800 rounded-xl p-4 flex flex-col items-center justify-center gap-2 active:scale-95 transition-all">
                    <div class="w-11 h-11 rounded-lg bg-zinc-900 text-brand border border-zinc-800 flex items-center justify-center">
                        <i class="fa-regular fa-image text-xl"></i>
                    </div>
                    <span class="text-xs font-bold uppercase">Arquivo</span>
                    <span class="text-[10px] text-zinc-400 text-center">Abrir galeria</span>
                </button>
            </div>

            <!-- Câmera Integrada ao Vivo -->
            <div id="live-camera-container" class="hidden relative rounded-lg overflow-hidden border border-brand/60 bg-black">
                <video id="camera-video" autoplay playsinline muted class="w-full max-h-72 object-cover bg-black"></video>
                <div class="absolute bottom-3 inset-x-0 flex items-center justify-center gap-4 px-4">

                    <button type="button" onclick="document.getElementById('camera-input').click()" class="bg-black/90 hover:bg-zinc-900 text-zinc-200 text-xs font-semibold px-3.5 py-2.5 rounded-lg border border-zinc-700 backdrop-blur-sm active:scale-95 transition-all" title="Usar câmera nativa">

            <!-- Pré-visualização da Imagem -->
            <div id="preview-container" class="hidden relative rounded-lg overflow-hidden border border-brand/50 bg-black">
                <img id="image-preview" src="" alt="Prévia" class="w-full max-h-64 object-contain mx-auto">
                <div class="absolute bottom-2 right-2 bg-black/85 border border-brand/40 text-brand text-[10px] px-2.5 py-1 rounded font-bold uppercase">
                    <i class="fa-solid fa-check mr-1"></i> DADOS CARREGADOS
                </div>
            </div>
        </div>

        <!-- Seção 2: Modo de Ajuda -->
        <div class="theme-card bg-zinc-950/90 border border-zinc-800 rounded-xl p-4 space-y-3 shadow-md">
            <div class="flex items-center gap-2 border-b border-zinc-800/90 pb-2">
                <span class="text-brand font-bold text-xs">[02]</span>
                <h2 class="font-bold text-xs uppercase tracking-wider">Protocolo de Execução</h2>

            <div class="grid grid-cols-2 gap-3 pt-1">
                <button type="button" id="mode-resposta" onclick="selectStudyMode('resposta')" class="mode-btn bg-brand text-black p-3.5 rounded-xl border border-transparent text-left space-y-1 shadow-sm transition-all">
                    <div class="flex items-center justify-between">
                        <i class="fa-solid fa-square-root-variable text-base"></i>
                        <i class="fa-solid fa-circle-check text-xs check-icon"></i>
                    </div>
                    <p class="font-extrabold text-xs pt-1 uppercase">Resolver</p>
                    <p class="text-[10px] opacity-85 leading-tight font-medium">Questões e contas passo a passo</p>
                </button>

                <button type="button" id="mode-resumo" onclick="selectStudyMode('resumo')" class="mode-btn theme-input bg-black text-zinc-300 p-3.5 rounded-xl border border-zinc-800 text-left space-y-1 transition-all">
                    <div class="flex items-center justify-between">
                        <i class="fa-solid fa-terminal text-base text-brand"></i>
                        <i class="fa-solid fa-circle-check text-xs check-icon hidden"></i>
                    </div>
                    <p class="font-bold text-xs pt-1 uppercase">Resumir</p>
                    <p class="text-[10px] text-zinc-400 leading-tight">Extrair pontos-chave p/ estudar</p>
                </button>
            </div>

            <!-- Observação opcional -->
            <div class="pt-1">
                <div class="relative">
                    <span class="absolute left-3 top-2.5 text-xs text-brand font-bold">&gt;_</span>
                    <input type="text" id="extra-note" placeholder="Parâmetro extra (ex: Só questão 3)..." class="theme-input w-full bg-black border border-zinc-800 rounded-lg pl-9 pr-3 py-2 text-xs focus:outline-none focus:border-brand transition-colors">
                </div>
            </div>
        </div>

        <!-- Botão Principal de Ação -->
        <button id="btn-analyze" onclick="analyzeHomework()" class="w-full bg-brand hover:bg-brand-dark text-black font-extrabold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg glow-brand active:scale-[0.99] transition-all text-sm uppercase tracking-wider">
            <i class="fa-solid fa-bolt"></i>
            <span id="btn-analyze-text">Executar Análise</span>

        <!-- Área de Carregamento -->

            <div class="w-9 h-9 border-4 border-brand border-t-transparent rounded-full animate-spin mx-auto"></div>
            <div>
                <p class="font-bold text-xs uppercase tracking-wider text-brand">Escaneando alvo...</p>
                <p id="loading-subtitle" class="text-[11px] text-zinc-400 mt-1">Processando anotações e cálculos</p>
            </div>
        </div>

        <!-- Área de Resultado -->
        <div id="result-card" class="hidden theme-card bg-zinc-950 border border-zinc-800 rounded-xl p-4 space-y-3 shadow-md">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2.5">
                <div class="flex items-center gap-2">
                    <span id="result-badge" class="bg-brand text-black text-[10px] font-extrabold px-2.5 py-1 rounded uppercase">Output</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="copyResult()" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-zinc-700 px-2.5 py-1.5 rounded-lg font-semibold flex items-center gap-1 transition-colors">
                        <i class="fa-regular fa-copy"></i> Copiar
                    </button>
                    <button onclick="shareWhatsApp()" class="text-xs bg-brand hover:bg-brand-dark text-black px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1 transition-colors">
                        <i class="fa-brands fa-whatsapp"></i> Enviar
                    </button>
                </div>
            </div>

            <div id="result-content" class="prose-content text-xs sm:text-sm leading-relaxed pt-1"></div>
        </div>

    </main>

    <!-- Toast de Notificação -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-brand text-xs font-bold px-4 py-2.5 rounded-lg shadow-xl border border-brand/50 opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center max-w-[90vw]">
        Aviso
    </div>

    <!-- Modal de Configurações -->
    <div id="modal-settings" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="theme-card bg-zinc-950 border border-zinc-800 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h3 class="font-extrabold text-sm uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-terminal text-brand"></i> Sistema
                </h3>
                <button onclick="toggleModal(false)" class="text-zinc-400 hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modo Claro / Escuro -->
            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold text-zinc-400 uppercase">Interface</label>
                <div class="grid grid-cols-2 gap-2 p-1 bg-black rounded-lg border border-zinc-800">
                    <button id="btn-mode-dark" onclick="setThemeMode('dark')" class="py-2 px-3 rounded text-xs font-bold flex items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-moon"></i> Dark
                    </button>
                    <button id="btn-mode-light" onclick="setThemeMode('light')" class="py-2 px-3 rounded text-xs font-bold flex items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-sun"></i> Light
                    </button>
                </div>
            </div>

            <!-- Cores de Destaque -->
            <div class="space-y-1.5">
                <label class="block text-[11px] font-bold text-zinc-400 uppercase">Cor do Terminal</label>
                <div class="flex items-center justify-between gap-2 p-2 bg-black rounded-lg border border-zinc-800">
                    <button onclick="setThemeColor('#10b981', '#059669')" class="w-8 h-8 rounded-full bg-emerald-500 border-2 border-transparent focus:border-white transition-all" title="Matrix Green"></button>
                    <button onclick="setThemeColor('#06b6d4', '#0891b2')" class="w-8 h-8 rounded-full bg-cyan-500 border-2 border-transparent focus:border-white transition-all" title="Cyber Cyan"></button>
                    <button onclick="setThemeColor('#a855f7', '#9333ea')" class="w-8 h-8 rounded-full bg-purple-500 border-2 border-transparent focus:border-white transition-all" title="Phantom Purple"></button>
                    <button onclick="setThemeColor('#ef4444', '#dc2626')" class="w-8 h-8 rounded-full bg-red-500 border-2 border-transparent focus:border-white transition-all" title="Red Ops"></button>
                    <button onclick="setThemeColor('#eab308', '#ca8a04')" class="w-8 h-8 rounded-full bg-yellow-500 border-2 border-transparent focus:border-white transition-all" title="Amber"></button>
                </div>
            </div>

            <!-- Instalar no celular -->
            <div class="space-y-2 border-t border-zinc-800 pt-3">
                <button type="button" onclick="triggerInstall()" class="w-full bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-zinc-800 font-semibold py-2.5 px-3 rounded-lg text-xs flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-mobile-screen-button text-brand"></i>
                    <span>Instalar na Tela Inicial</span>
                </button>
            </div>

            <button onclick="saveSettings()" class="w-full bg-brand hover:bg-brand-dark text-black font-extrabold py-2.5 rounded-lg text-xs uppercase tracking-wider shadow-md active:scale-[0.98] transition-all">
                Salvar
            </button>
        </div>
    </div>

    <script>
        let currentMode = 'dark';
        let currentColor = '#10b981';
        let currentHover = '#059669';
        let studyMode = 'resposta'; // 'resposta' ou 'resumo'
        let base64Image = null;
        let imageMimeType = 'image/jpeg';
        let rawResultText = '';
        let deferredPrompt = null;
        let activeStream = null;

        // SVG oficial da Caveira Tática GHØST para ícone do APK / Tela Inicial
        const ghostSkullSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#050505"/><path d="M112 208C112 119.634 176.471 48 256 48C335.529 48 400 119.634 400 208V296C400 348 364 388 320 408L304 464H208L192 408C148 388 112 348 112 296V208Z" fill="#18181b" stroke="#10b981" stroke-width="14"/><path d="M144 224C144 164 192 120 256 120C320 120 368 164 368 224C368 268 344 300 312 316L300 384H212L200 316C168 300 144 268 144 224Z" fill="#f4f4f5"/><path d="M168 220L232 236L220 276L172 264L168 220Z" fill="#050505"/><path d="M344 220L280 236L292 276L340 264L344 220Z" fill="#050505"/><path d="M256 272L236 316H276L256 272Z" fill="#050505"/><line x1="228" y1="336" x2="228" y2="384" stroke="#050505" stroke-width="14"/><line x1="256" y1="336" x2="256" y2="384" stroke="#050505" stroke-width="14"/><line x1="284" y1="336" x2="284" y2="384" stroke="#050505" stroke-width="14"/><path d="M280 128L264 168L284 192" stroke="#050505" stroke-width="12" stroke-linecap="round"/></svg>`;

        // Service Worker Inline obrigatório para WebAPK / TWA
        const swCode = `
            const CACHE_NAME = 'ghost-ops-v1';
            self.addEventListener('install', (e) => { self.skipWaiting(); });
            self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
            self.addEventListener('fetch', (e) => {
                e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
            });
        `;

        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            registerServiceWorker();
            setupPWA();
        });

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    const blob = new Blob([swCode], { type: 'application/javascript' });
                    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
                } catch (e) {}
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3200);
        }

        // Abre a câmera ao vivo no próprio app (com fallback para o seletor nativo)
        async function openCamera() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    activeStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: 'environment' } },
                        audio: false
                    });
                    const videoEl = document.getElementById('camera-video');
                    videoEl.srcObject = activeStream;
                    document.getElementById('upload-area').classList.add('hidden');
                    document.getElementById('live-camera-container').classList.remove('hidden');
                    return;
                } catch (err) {
                    // Se o usuário negar permissão ou estiver em iframe restrito, aciona o input nativo
                    document.getElementById('camera-input').click();
                    return;
                }
            }
            document.getElementById('camera-input').click();
        }

        function closeCamera() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
                activeStream = null;
            }
            const videoEl = document.getElementById('camera-video');
            if (videoEl) videoEl.srcObject = null;
            document.getElementById('live-camera-container').classList.add('hidden');
            if (!base64Image) {
                document.getElementById('upload-area').classList.remove('hidden');
            }
        }

        function captureFromVideo() {
            const videoEl = document.getElementById('camera-video');
            if (!videoEl || !videoEl.videoWidth) return;

            const canvas = document.createElement('canvas');
            const maxDim = 1280;
            let width = videoEl.videoWidth;
            let height = videoEl.videoHeight;

            if (width > maxDim || height > maxDim) {
                if (width > height) {
                    height = Math.round((height * maxDim) / width);
                    width = maxDim;
                } else {
                    width = Math.round((width * maxDim) / height);
                    height = maxDim;
                }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
            base64Image = compressedDataUrl.split(',')[1];
            imageMimeType = 'image/jpeg';

            closeCamera();

            document.getElementById('image-preview').src = compressedDataUrl;
            document.getElementById('upload-area').classList.add('hidden');
            document.getElementById('preview-container').classList.remove('hidden');
            document.getElementById('btn-clear-photo').classList.remove('hidden');
            document.getElementById('result-card').classList.add('hidden');
        }

        // Redimensiona e comprime a imagem para envio rápido no celular
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            closeCamera();

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 1280;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    base64Image = compressedDataUrl.split(',')[1];
                    imageMimeType = 'image/jpeg';

                    document.getElementById('image-preview').src = compressedDataUrl;
                    document.getElementById('upload-area').classList.add('hidden');
                    document.getElementById('preview-container').classList.remove('hidden');
                    document.getElementById('btn-clear-photo').classList.remove('hidden');
                    document.getElementById('result-card').classList.add('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearPhoto() {
            closeCamera();
            base64Image = null;
            document.getElementById('camera-input').value = '';
            document.getElementById('gallery-input').value = '';
            document.getElementById('upload-area').classList.remove('hidden');
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('btn-clear-photo').classList.add('hidden');
            document.getElementById('result-card').classList.add('hidden');
        }

        function selectStudyMode(mode) {
            studyMode = mode;
            const btnResp = document.getElementById('mode-resposta');
            const btnResu = document.getElementById('mode-resumo');
            const actionText = document.getElementById('btn-analyze-text');

            if (mode === 'resposta') {
                activateCardButton(btnResp);
                deactivateCardButton(btnResu);
                actionText.innerText = 'Executar Resolução';
            } else {
                activateCardButton(btnResu);
                deactivateCardButton(btnResp);
                actionText.innerText = 'Gerar Resumo';
            }
        }

        function activateCardButton(btn) {
            btn.classList.remove('theme-input', 'bg-black', 'bg-zinc-100', 'text-zinc-300', 'text-zinc-700', 'border-zinc-800', 'border-zinc-300');
            btn.classList.add('bg-brand', 'text-black', 'border-transparent');
            btn.querySelector('.check-icon').classList.remove('hidden');
            const sub = btn.querySelector('p:last-child');
            sub.classList.remove('text-zinc-400', 'text-zinc-500');
            sub.classList.add('opacity-85');
        }

        function deactivateCardButton(btn) {
            btn.classList.remove('bg-brand', 'text-black', 'border-transparent');
            btn.querySelector('.check-icon').classList.add('hidden');
            const sub = btn.querySelector('p:last-child');
            sub.classList.remove('opacity-85');

            if (currentMode === 'light') {
                btn.classList.add('bg-zinc-100', 'text-zinc-800', 'border-zinc-300');
                sub.classList.add('text-zinc-500');
            } else {
                btn.classList.add('bg-black', 'text-zinc-300', 'border-zinc-800');
                sub.classList.add('text-zinc-400');
            }
        }

        // Chamada à API Gemini com retry exponencial
        async function fetchWithRetry(url, options, maxRetries = 4) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) {
                        return await response.json();
                    }
                    if (response.status !== 429 && response.status < 500) {
                        throw new Error(`Erro na requisição: ${response.status}`);
                    }
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
        }

        async function analyzeHomework() {
            if (!base64Image) {
                showToast('Tire uma foto ou escolha uma imagem primeiro!');
                return;
            }

            const btn = document.getElementById('btn-analyze');
            const loadingCard = document.getElementById('loading-card');
            const resultCard = document.getElementById('result-card');
            const extraNote = document.getElementById('extra-note').value.trim();

            btn.disabled = true;
            btn.classList.add('opacity-60');
            loadingCard.classList.remove('hidden');
            resultCard.classList.add('hidden');

            let promptText = '';
            if (studyMode === 'resposta') {
                promptText = `Você é um estudante experiente ajudando um colega com o dever de casa em português do Brasil. 
Olhe com atenção para esta foto e resolva todas as questões, exercícios ou contas matemáticas que aparecem nela.
Regras obrigatórias:
- NUNCA mencione que você é uma inteligência artificial, assistente virtual, modelo de linguagem ou sistema automatizado. Escreva exatamente como uma pessoa real mandando a resposta para um amigo.
- Use linguagem 100% natural, humana, leve e direta (sem introduções formais como "Com certeza!", "Aqui está a resolução:" ou "Como uma IA..."). Vá direto ao ponto.
- Se houver contas matemáticas, equações, física ou química, mostre o passo a passo do cálculo de forma limpa e destaque a resposta final em negrito.
- Se forem questões de marcar (múltipla escolha), diga qual é a alternativa certa e explique rapidinho o porquê.
- Se forem perguntas abertas, entregue a resposta pronta para copiar no caderno.`;
            } else {
                promptText = `Você é um colega de turma bom de estudo resumindo a matéria para a prova em português do Brasil.
Leia o conteúdo desta foto e monte um resumo direto para estudar.
Regras obrigatórias:
- NUNCA mencione que você é uma inteligência artificial, assistente virtual ou sistema automatizado. Escreva como um estudante real passando suas anotações para um amigo.
- Use linguagem 100% natural, humana e objetiva (sem saudações robóticas no início).
- Separe os pontos principais em tópicos fáceis de memorizar.
- Destaque fórmulas, datas, conceitos-chave e feche com uma dica rápida de estudo.`;
            }

            if (extraNote) {
                promptText += `\n\nObservação adicional do estudante: "${extraNote}"`;
            }

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: promptText },
                            {
                                inlineData: {
                                    mimeType: imageMimeType,
                                    data: base64Image
                                }
                            }
                        ]
                    }
                ]
            };

            try {
                const result = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const generatedText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                if (generatedText) {
                    rawResultText = generatedText;
                    document.getElementById('result-badge').innerText = studyMode === 'resposta' ? '> RESPOSTA' : '> RESUMO';
                    document.getElementById('result-content').innerHTML = marked.parse(generatedText);
                    resultCard.classList.remove('hidden');
                    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    showToast('Não consegui ler direito a imagem. Tente uma foto mais nítida.');
                }
            } catch (error) {
                showToast('Ocorreu um erro ao analisar a foto. Tente novamente.');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-60');
                loadingCard.classList.add('hidden');
            }
        }

        function copyResult() {
            if (!rawResultText) return;
            const cleanText = rawResultText.replace(/\*\*/g, '*').replace(/### /g, '').replace(/## /g, '');
            const textArea = document.createElement('textarea');
            textArea.value = cleanText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast('Texto copiado!');
        }

        function shareWhatsApp() {
            if (!rawResultText) return;
            const cleanText = rawResultText.replace(/\*\*/g, '*');
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(cleanText)}`;
            window.open(url, '_blank');
        }

        function toggleModal(show) {
            const modal = document.getElementById('modal-settings');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function setThemeMode(mode) {
            currentMode = mode;
            const body = document.body;
            const header = document.getElementById('app-header');
            const cards = document.querySelectorAll('.theme-card');
            const inputs = document.querySelectorAll('.theme-input');

            if (mode === 'light') {
                body.classList.remove('bg-[#050505]', 'text-zinc-200');
                body.classList.add('bg-zinc-100', 'text-zinc-900');

                header.classList.remove('bg-black/90', 'border-zinc-800/90');
                header.classList.add('bg-white', 'border-zinc-200');

                cards.forEach(c => {
                    c.classList.remove('bg-zinc-950/90', 'bg-zinc-950', 'border-zinc-800');
                    c.classList.add('bg-white', 'border-zinc-200');
                });

                inputs.forEach(i => {
                    i.classList.remove('bg-black', 'border-zinc-800', 'text-zinc-300');
                    i.classList.add('bg-zinc-100', 'border-zinc-300', 'text-zinc-800');
                });

                document.getElementById('btn-mode-light').className = 'py-2 px-3 rounded text-xs font-bold flex items-center justify-center gap-2 bg-brand text-black shadow-sm';
                document.getElementById('btn-mode-dark').className = 'py-2 px-3 rounded text-xs font-bold flex items-center justify-center gap-2 text-zinc-500';
            } else {
                body.classList.remove('bg-zinc-100', 'text-zinc-900');
                body.classList.add('bg-[#050505]', 'text-zinc-200');

                header.classList.remove('bg-white', 'border-zinc-200');
                header.classList.add('bg-black/90', 'border-zinc-800/90');

                cards.forEach(c => {
                    c.classList.remove('bg-white', 'border-zinc-200');
                    c.classList.add('bg-zinc-950/90', 'border-zinc-800');
                });

                inputs.forEach(i => {
                    i.classList.remove('bg-zinc-100', 'border-zinc-300', 'text-zinc-800');
                    i.classList.add('bg-black', 'border-zinc-800', 'text-zinc-300');
                });

                document.getElementById('btn-mode-dark').className = 'py-2 px-3 rounded text-xs font-bold flex items-center justify-center gap-2 bg-brand text-black shadow-sm';
                document.getElementById('btn-mode-light').className = 'py-2 px-3 rounded text-xs font-bold flex items-center justify-center gap-2 text-zinc-400';
            }
            selectStudyMode(studyMode);
        }

        function setThemeColor(hex, hoverHex) {
            currentColor = hex;
            currentHover = hoverHex;
            document.documentElement.style.setProperty('--brand-color', hex);
            document.documentElement.style.setProperty('--brand-hover', hoverHex);
        }

        function saveSettings() {
            localStorage.setItem('estuda_theme_mode', currentMode);
            localStorage.setItem('estuda_theme_color', currentColor);
            localStorage.setItem('estuda_theme_hover', currentHover);
            toggleModal(false);
            showToast('Preferências salvas!');
        }

        function loadSettings() {
            const savedMode = localStorage.getItem('estuda_theme_mode') || 'dark';
            const savedColor = localStorage.getItem('estuda_theme_color') || '#10b981';
            const savedHover = localStorage.getItem('estuda_theme_hover') || '#059669';

            setThemeMode(savedMode);
            setThemeColor(savedColor, savedHover);
        }

        function setupPWA() {
            const iconDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ghostSkullSvg);
            document.getElementById('favicon-placeholder').setAttribute('href', iconDataUrl);
            document.getElementById('apple-icon-placeholder').setAttribute('href', iconDataUrl);

            const manifest = {
                "name": "GHØST",
                "short_name": "GHØST",
                "description": "GHØST",
                "start_url": "./",
                "scope": "./",
                "display": "standalone",
                "orientation": "portrait",
                "background_color": "#050505",
                "theme_color": "#050505",
                "icons": [
                    {
                        "src": iconDataUrl,
                        "sizes": "192x192",
                        "type": "image/svg+xml",
                        "purpose": "any maskable"
                    },
                    {
                        "src": iconDataUrl,
                        "sizes": "512x512",
                        "type": "image/svg+xml",
                        "purpose": "any maskable"
                    }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('pwa-install-header').classList.remove('hidden');
                document.getElementById('header-spacer').classList.add('hidden');
            });
        }

        function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                });
            } else {
                showToast('Toque nos 3 pontinhos do navegador > "Adicionar à tela inicial"');
            }
        }
    </script>
